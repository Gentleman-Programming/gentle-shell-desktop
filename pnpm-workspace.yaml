allowBuilds:
  # Transitive deps of @earendil-works/pi-coding-agent (T3 sessions
  # adapter): @google/genai's preinstall/prepare are no-op/vendor-asset
  # scripts, protobufjs's postinstall is its standard version-scheme
  # check. Both ship from a trusted same-org (@earendil-works) dependency
  # already used elsewhere in the Gentle stack.
  '@google/genai': true
  electron-winstaller: false
  esbuild: true
  protobufjs: true
